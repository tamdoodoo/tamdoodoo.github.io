<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lành Menu Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Fraunces:opsz,wght,SOFT@9..144,500..900,0..100&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<style>
  /* ============ LÀNH BRAND ============ */
  :root {
    --green: #0C4725; --green-2: #155C36; --green-ink: #0A3A1F;
    --lime: #B9D76B; --lime-2: #D3E8A1; --lime-soft: #EEF5DA;
    --cream: #F6F0DE; --cream-2: #EDE5CC; --white: #FFFFFF;
    --muted: #5E7364; --line: #DCD3B8; --panel: #F9F6EF; --field-line: #ECE8DF;
    --display: "Fraunces", Georgia, serif;
    --body: "Bricolage Grotesque", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--cream); color: var(--green-ink); font: 15px/1.45 var(--body); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .display { font-family: var(--display); font-variation-settings: "SOFT" 100; }

  /* ---------- Top bar ---------- */
  .top { position: sticky; top: 0; z-index: 20; background: var(--green); color: var(--white); }
  .top-in { max-width: 1440px; margin: 0 auto; padding: 14px 32px; display: flex; align-items: center; gap: 16px; }
  .mark { display: inline-flex; }
  .mark svg { height: 44px; width: auto; display: block; }
  .top .sub { color: var(--lime); font-size: 13px; font-weight: 500; padding-left: 14px; border-left: 1px solid rgba(255,255,255,.18); }
  .top .grow { flex: 1; }
  .pill { border: 1.5px solid currentColor; background: transparent; border-radius: 999px; padding: 8px 16px; font-weight: 600; font-size: 13px; letter-spacing: .02em; white-space: nowrap; transition: background .15s, color .15s; }
  .top .pill { color: var(--white); border-color: rgba(255,255,255,.4); }
  .top .pill:hover { background: rgba(255,255,255,.1); border-color: var(--white); }
  .pill.lime { background: var(--lime); color: var(--green); border-color: var(--lime); }
  .top .pill.lime { color: var(--green); border-color: var(--lime); }
  .top .pill.lime:hover { background: var(--lime-2); border-color: var(--lime-2); }
  .menu-more { position: relative; }
  .more-list { position: absolute; right: 0; top: calc(100% + 8px); background: var(--white); color: var(--green-ink); border-radius: 16px; box-shadow: 0 12px 32px rgba(13,74,42,.18); padding: 6px; min-width: 200px; display: none; }
  .more-list.open { display: block; }
  .more-list button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 10px 12px; border-radius: 10px; font-size: 14px; }
  .more-list button:hover { background: var(--lime-soft); }

  /* ---------- Layout ---------- */

  .pills { position: sticky; top: 68px; z-index: 10; background: var(--cream); padding: 14px 0; margin-bottom: 8px; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  .pills::-webkit-scrollbar { display: none; }
  .pills .pill { color: var(--green); border-color: var(--green); background: transparent; padding: 9px 18px; }
  .pills .pill:hover { background: var(--lime-soft); }
  .pills .pill.on { background: var(--green); color: var(--lime); }

  .step { display: flex; align-items: baseline; gap: 12px; margin: 28px 0 14px; }
  .step h2 { margin: 0; font-family: var(--display); font-variation-settings: "SOFT" 100; font-size: 21px; font-weight: 800; line-height: 1.15; color: var(--green); }
  .step .aside { margin-left: auto; font-size: 13px; color: var(--muted); }

  .panel { background: var(--white); border-radius: 28px; padding: 24px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; }
  .f { display: block; }
  .f > span { display: block; font-size: 15px; font-weight: 500; color: #111; margin-bottom: 8px; }
  .f > span small { font-size: 12px; font-weight: 400; color: var(--muted); }
  .inp { width: 100%; border: 1.5px solid var(--line); border-radius: 14px; padding: 11px 14px; font: inherit; background: var(--cream); color: var(--green-ink); transition: border-color .15s, background .15s; }
  .inp:hover { border-color: #C8BE9E; }
  .inp:focus { outline: none; border-color: var(--green); background: var(--white); box-shadow: 0 0 0 4px rgba(184,217,110,.45); }
  textarea.inp { resize: vertical; min-height: 92px; }
  .full { grid-column: 1 / -1; }

  .icon-btn { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--white); display: grid; place-items: center; font-size: 14px; color: var(--green); }
  .icon-btn:hover:not(:disabled) { border-color: var(--green); }
  .icon-btn:disabled { opacity: .35; cursor: default; }

  .plate { position: relative; width: 100%; aspect-ratio: 1; border-radius: 50%; background: var(--cream) center/cover no-repeat; box-shadow: inset 0 0 0 10px var(--white), inset 0 0 0 11px var(--cream-2), 0 6px 18px rgba(13,74,42,.10); display: grid; place-items: center; transition: transform .2s; }
  .plate.sm { width: 112px; flex: none; }
  .plate .ph { color: #BFB596; display: grid; place-items: center; gap: 6px; font-size: 12px; text-align: center; }
  .plate.drag { outline: 3px dashed var(--lime); outline-offset: 4px; }
  .plus { position: absolute; right: 4%; bottom: 4%; width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--green); color: var(--lime); font-size: 24px; line-height: 1; display: grid; place-items: center; box-shadow: 0 4px 12px rgba(13,74,42,.3); transition: transform .15s, background .15s; }
  .plus:hover { transform: scale(1.08); background: var(--green-2); }
  .plate.sm .plus { width: 34px; height: 34px; font-size: 20px; right: -2px; bottom: -2px; }
  .x-img { position: absolute; left: 4%; bottom: 4%; width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--white); color: var(--green); box-shadow: 0 3px 10px rgba(0,0,0,.15); font-size: 14px; }
  .plate.sm .x-img { left: -2px; bottom: -2px; width: 28px; height: 28px; }


  .switch { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); cursor: pointer; user-select: none; }
  .switch input { appearance: none; width: 34px; height: 20px; border-radius: 999px; background: var(--cream-2); position: relative; margin: 0; cursor: pointer; transition: background .15s; }
  .switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--white); box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .15s; }
  .switch input:checked { background: var(--green); }
  .switch input:checked::after { transform: translateX(14px); background: var(--lime); }
  .switch:has(input:checked) { color: var(--green); }

  .img-field { display: flex; align-items: center; gap: 18px; }
  .img-field .meta strong { display: block; font-size: 16px; color: var(--green); margin-bottom: 2px; }
  .img-field .meta { font-size: 13px; color: var(--muted); }
  .swatches { display: flex; gap: 14px; flex-wrap: wrap; }
  .swatch { display: flex; align-items: center; gap: 10px; background: var(--cream); border-radius: 999px; padding: 6px 14px 6px 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .swatch input { appearance: none; width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--white); box-shadow: 0 0 0 1px var(--line); padding: 0; cursor: pointer; background: none; }
  .swatch input::-webkit-color-swatch-wrapper { padding: 0; }
  .swatch input::-webkit-color-swatch { border: 0; border-radius: 50%; }
  .swatch input::-moz-color-swatch { border: 0; border-radius: 50%; }

  .pager { display: flex; justify-content: space-between; margin-top: 28px; gap: 12px; }
  .pager .pill { color: var(--green); border-color: var(--green); padding: 11px 20px; }
  .pager .pill:hover { background: var(--lime-soft); }
  .pager .pill.solid { background: var(--green); color: var(--lime); }
  .pager .pill.solid:hover { background: var(--green-2); }

  /* ---------- Preview ---------- */
  .frame { border-radius: 18px; overflow: hidden; cursor: zoom-in; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  .scaler { transform-origin: top left; }

  .zoom { position: fixed; inset: 0; z-index: 50; background: rgba(11,58,33,.92); display: none; align-items: flex-start; justify-content: center; overflow: auto; padding: 32px 16px; cursor: zoom-out; }
  .zoom.open { display: flex; }
  .zoom .close { position: fixed; top: 16px; right: 16px; z-index: 2; }

  .fab { display: none; position: fixed; right: 16px; bottom: 16px; z-index: 30; box-shadow: 0 8px 24px rgba(13,74,42,.35); padding: 13px 20px; font-size: 14px; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 12px); background: var(--green); color: var(--white); padding: 12px 18px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 60; box-shadow: 0 10px 30px rgba(13,74,42,.3); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast::before { content: "✓ "; color: var(--lime); font-weight: 700; }

  @media (max-width: 640px) {
    .top-in { padding: 12px 16px; }
    .top .sub { display: none; }
    .top .hide-sm { display: none; }
  }

  /* ---------- Sidebar + stage layout ---------- */
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  .top-in { max-width: none; }
  .app { flex: 1; min-height: 0; display: grid; grid-template-columns: 440px minmax(0, 1fr); }
  .side { background: var(--white); display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
  .side .pills { position: static; background: var(--white); padding: 14px 18px; margin: 0; border-bottom: 1px solid var(--cream-2); }
  .side .pills .pill { padding: 7px 14px; }
  .side-body { flex: 1; overflow-y: auto; padding: 4px 20px 28px; }
  .side .step { margin: 26px 0 12px; }
  .side .panel { background: var(--panel); border-radius: 16px; padding: 20px 18px; }
  .side .grid2 { grid-template-columns: 1fr; }
  .side .inp { background: var(--white); border: 1px solid var(--field-line); border-radius: 8px; padding: 12px 14px; }
  .side .inp:hover { border-color: #DCD7CB; }
  .side .swatches { gap: 8px; }
  .side .swatch { background: var(--white); border: 1px solid var(--field-line); border-radius: 8px; }
  .warn { margin: 0; font-size: 13px; color: #A33A1E; background: #FBEDE7; border-radius: 8px; padding: 8px 12px; }
  .warn[hidden] { display: none; }
  .side .times { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .side .times .inp { padding: 8px 6px; text-align: center; }
  .rows { display: flex; flex-direction: column; gap: 10px; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; background: var(--panel); border-radius: 16px; padding: 12px; }
  .row .plate.sm { width: 56px; }
  .row .plate { box-shadow: inset 0 0 0 4px var(--white), 0 2px 8px rgba(12,71,37,.10); }
  .row .plate .ph svg { width: 18px; height: 26px; }
  .row .plate.sm .plus { width: 24px; height: 24px; font-size: 16px; right: -4px; bottom: -4px; }
  .row .plate.sm .x-img { width: 22px; height: 22px; font-size: 10px; left: -4px; bottom: -4px; }
  .row-main { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .row-name { font-weight: 600; padding: 9px 12px; }
  .row-ing { font-size: 13px; padding: 7px 12px; color: var(--muted); }
  .row-side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .row-move { display: flex; gap: 4px; }
  .row-move .icon-btn { width: 26px; height: 26px; font-size: 12px; }
  .side .img-field .plate.sm { width: 84px; }
  .side .pager { margin-top: 22px; }
  .side .pager .pill { padding: 9px 16px; }
  .stage { min-height: 0; overflow: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px; background: var(--cream); }
  .stage .frame { border-radius: 14px; box-shadow: 0 24px 60px rgba(12,71,37,.22); flex: none; }
  .stage-note { margin: 16px 0 0; font-size: 12px; color: var(--muted); }
  @media (max-width: 1000px) {
    body { overflow: auto; display: block; }
    .app { grid-template-columns: 1fr; }
    .stage { display: none; }
    .side-body { overflow: visible; }
    .fab { display: inline-flex; }
  }

  /* ============ MENU TEMPLATE (designer: restyle here) ============ */
  /* Built on the 595 × 842 A4 artboard from the Figma file; exported at 2480 px wide */
  .menu {
    --m-bg: #004821; --m-lime: #B9D76B; --m-cream: #F7F0DC; --m-bottle: #0D4726; --m-ink: #1B1B1B;
    width: 595px; height: 842px; position: relative; overflow: hidden;
    background: var(--m-bg); color: var(--m-ink); font-family: var(--body);
  }
  .m-deco { position: absolute; left: 0; top: 0; width: 595px; height: 842px; pointer-events: none; }
  .m-deco .lime { fill: var(--m-lime); }
  .m-logo { position: absolute; left: 31px; top: 34px; width: 172px; }
  .m-logo svg { width: 100%; height: auto; display: block; }
  .m-logo-img { position: absolute; left: 31px; top: 30px; width: 172px; height: 92px; background: left center/contain no-repeat; }
  .m-pills { position: absolute; left: 308px; top: 48px; display: flex; gap: 6px; }
  .m-pill { height: 18px; padding: 0 8px; border-radius: 9px; background: var(--m-lime); color: var(--m-bg); font-size: 9px; font-weight: 600; display: inline-flex; align-items: center; white-space: nowrap; }
  .m-title { position: absolute; left: 308px; top: 72px; width: 245px; margin: 0; color: #fff; font-family: var(--display); font-variation-settings: "SOFT" 100; font-weight: 800; font-size: 23px; line-height: 23px; letter-spacing: -.01em; text-wrap: balance; }
  .m-day { position: absolute; width: 261px; height: 150px; border-radius: 12px; background: var(--m-cream); }
  .m-day-head { position: absolute; left: 14px; right: 64px; top: 10px; height: 18px; display: flex; align-items: center; gap: 7px; }
  .m-day-tag { flex: none; height: 18px; padding: 0 7px; border-radius: 9px; background: var(--m-bg); color: #fff; font-size: 8.5px; font-weight: 600; display: flex; align-items: center; white-space: nowrap; }
  .m-day-name { min-width: 0; font-family: var(--display); font-variation-settings: "SOFT" 100; font-weight: 800; font-size: 12.5px; color: var(--m-bg); white-space: nowrap; overflow: hidden; flex: 1; }
  .m-items { position: absolute; left: 0; top: 36px; width: 192px; list-style: none; margin: 0; padding: 0; }
  .m-item { display: grid; grid-template-columns: 58px minmax(0, 1fr); height: 22px; }
  .m-time { padding-left: 20px; font-size: 7.5px; font-weight: 600; line-height: 10px; }
  .m-name { font-size: 7.5px; font-weight: 600; line-height: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m-new { display: inline-block; background: var(--m-lime); color: var(--m-bg); font-size: 5.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 1px 4px; border-radius: 4px; margin-left: 4px; vertical-align: 1px; }
  .m-ing { font-size: 5.6px; line-height: 8px; color: #3A3A3A; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m-bottle { position: absolute; left: 194px; top: 13px; width: 46px; height: 127px; background: center bottom/contain no-repeat; }
  .m-bottle svg { width: 100%; height: 100%; display: block; fill: var(--m-bottle); }
  /* Notes stay above the lime shapes; anything longer is hidden */
  .m-extra { position: absolute; left: 308px; top: 668px; width: 261px; height: 80px; overflow: hidden; color: #fff; }
  .m-note { font-size: 7.5px; line-height: 10px; }
  .m-note b { display: block; font-family: var(--display); font-variation-settings: "SOFT" 100; font-size: 13px; line-height: 16px; font-weight: 800; margin-bottom: 5px; }
  .m-note ul { list-style: none; margin: 5px 0 0; padding: 0; }
  .m-note li { position: relative; padding-left: 9px; margin-top: 3px; }
  .m-note li::before { content: ""; position: absolute; left: 0; top: 3.5px; width: 3.5px; height: 3.5px; border-radius: 50%; background: var(--m-lime); }

  @media print {
    @page { size: 595px 842px; margin: 0; }
    body > *:not(.print-root) { display: none !important; }
    .print-root { display: block !important; }
  }
  .print-root { display: none; }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <span class="mark" id="topMark" aria-label="lành healthy"></span>
    <span class="sub">Menu Maker</span>
    <span class="grow"></span>
    <button class="pill hide-sm" id="openJson">Mở bản nháp</button>
    <button class="pill hide-sm" id="saveJson">Lưu bản nháp</button>
    <div class="menu-more">
      <button class="pill" id="moreBtn" aria-label="Thêm">•••</button>
      <div class="more-list" id="moreList">
        <button data-act="open">Mở bản nháp</button>
        <button data-act="save">Lưu bản nháp</button>
        <button data-act="print">In / Lưu PDF</button>
        <button data-act="reset">Về menu mẫu</button>
      </div>
    </div>
    <button class="pill lime" id="exportPng">Lưu ảnh menu</button>
  </div>
</header>

<div class="app">
  <aside class="side">
    <nav class="pills" id="tabs"></nav>
    <div class="side-body" id="panel"></div>
  </aside>
  <main class="stage" id="stage">
    <div class="frame" id="frame"><div class="scaler" id="scaler"><div class="menu" id="menu"></div></div></div>
    <p class="stage-note">Bấm vào menu để phóng to · Ảnh lưu ra 2480 × 3508 px (A4)</p>
  </main>
</div>

<div class="zoom" id="zoom"><button class="pill lime close">Đóng</button><div class="scaler" id="zoomScaler"></div></div>
<button class="pill lime fab" id="fab">Xem menu</button>
<div class="print-root" id="printRoot"></div>
<input type="file" id="fileImg" accept="image/*" hidden>
<input type="file" id="fileJson" accept="application/json,.json" hidden>
<div class="toast" id="toast"></div>

<script>
const STORE_KEY = 'lanh-detox-menu-v4';

const b = (name, ing, isNew = false) => ({ name, ing, isNew, image: null });
const DEFAULT = {
  logo: null,
  title: 'Gói đặc biệt chuyên sâu',
  subtitle: 'Toàn diện 7 ngày',
  note: '<b>Lưu ý:</b> Liều lượng và Detox sẽ được điều chỉnh tùy vào mục đích của khách, số kg khách muốn giảm và thể trạng của khách.\n- Lắc đều trước khi uống và dùng đúng khung giờ trên menu.\n- Bảo quản lạnh 2–6°C và dùng hết trong ngày.',
  times: ['9:00', '12:00', '15:00', '17:00', '19:00'],
  theme: { bg: '#004821', lime: '#B9D76B', cream: '#F7F0DC' },
  days: [
    { name: 'Thanh lọc', image: null, items: [
      b('Detox rau má', 'Rau má, dừa, hạt chia'),
      b('Smoothie xoài chuối', 'Xoài, chuối, yến mạch'),
      b('Detox dưa hấu', 'Dưa hấu, củ dền, cam', true),
      b('Detox khổ qua', 'Khổ qua, dưa leo, táo'),
      b('Detox gạo lứt', 'Gạo lứt, đậu đen') ] },
    { name: 'Nhẹ bụng', image: null, items: [
      b('Detox bí đao', 'Bí đao, dưa leo, táo'),
      b('Smoothie thanh long đỏ', 'Thanh long đỏ, yến mạch'),
      b('Ginger shot', 'Gừng'),
      b('Detox cam', 'Cam, nước dừa, hạt chia'),
      b('Detox gạo lứt', 'Gạo lứt, đậu đen') ] },
    { name: 'Thanh lọc sâu', image: null, items: [
      b('Detox cần tây', 'Cần tây, dưa leo, táo'),
      b('Smoothie cải bó xôi', 'Cải bó xôi, bột mầm lúa mạch'),
      b('Detox củ dền', 'Củ dền, táo, ổi'),
      b('Detox lá tía tô', 'Lá tía tô'),
      b('Detox gạo lứt', 'Gạo lứt') ] },
    { name: 'Tăng tốc thanh lọc', image: null, items: [
      b('Detox rau má', 'Rau má, nước dừa, hạt chia'),
      b('Smoothie thanh long đỏ', 'Thanh long đỏ, yến mạch'),
      b('Detox lựu', 'Lựu, táo, chanh', true),
      b('Detox dưa leo', 'Dưa leo, táo, gừng, chanh'),
      b('Detox gạo lứt', 'Gạo lứt, đậu đen') ] },
    { name: 'Giảm cân nhẹ', image: null, items: [
      b('Detox khổ qua', 'Khổ qua'),
      b('Smoothie cải bó xôi', 'Cải bó xôi, mầm lúa mạch'),
      b('Ginger shot', 'Gừng'),
      b('Detox táo củ dền', 'Táo, củ dền, cà rốt, cam', true),

const withDefaults = data => ({ ...structuredClone(DEFAULT), ...data, theme: { ...DEFAULT.theme, ...data.theme }, times: data.times || [...DEFAULT.times] });
let state = load();
let tab = 'general';

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return withDefaults(JSON.parse(raw));
  } catch (e) {}
  return structuredClone(DEFAULT);
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch (e) { if (e.name === 'QuotaExceededError') toast('Bộ nhớ trình duyệt đầy — hãy bấm “Lưu bản nháp” để giữ file.'); }
}

const rich = s => esc(s).replace(/&lt;(\/?)(b|em)&gt;/g, '<$1$2>');
// Lines starting with "- " become bullet points; other lines stay as text
const noteHTML = s => {
  const lines = String(s || '').split('\n');
  const text = lines.filter(l => !/^\s*[-•]\s/.test(l)).map(rich).join('<br>');
  const items = lines.filter(l => /^\s*[-•]\s/.test(l)).map(l => `<li>${rich(l.replace(/^\s*[-•]\s+/, ''))}</li>`).join('');
  return text + (items ? `<ul>${items}</ul>` : '');
};

const BOTTLE = `<svg viewBox="225 161 46 127" aria-hidden="true"><path d="M248.256 161C238.974 161 231.324 162.126 231.324 164.173V168.983C231.324 170.313 233.567 171.03 236.219 171.541V173.792C229.08 177.272 225 185.766 225 193.543V283.088C225 286.056 226.938 288 229.691 288H266.307C269.265 288 270.998 286.056 270.998 283.088V193.543C270.998 185.049 267.123 177.169 260.084 173.792V171.541C263.042 171.03 265.082 170.212 265.082 168.983V164.173C265.082 162.126 257.534 161 248.252 161H248.256Z"/></svg>`;
// Day cards fill the 2-column grid left→right; slot 8 (bottom right) holds the notes
const CARD_X = [31, 308], CARD_Y = [148, 320, 492, 664];

function menuHTML() {
  const day = (d, i) => `
    <section class="m-day" style="left:${CARD_X[i % 2]}px;top:${CARD_Y[i >> 1]}px">
      <div class="m-day-head"><span class="m-day-tag">Ngày ${i + 1}</span><span class="m-day-name">${esc(d.name)}</span></div>
      <ol class="m-items">${d.items.map((it, j) => `
        <li class="m-item">
          <span class="m-time">${esc(state.times[j] || '')}</span>
          <div>
            <div class="m-name">${esc(it.name)}${it.isNew ? '<span class="m-new">Mới</span>' : ''}</div>
            ${it.ing ? `<div class="m-ing">${esc(splitIng(it.ing).join(', '))}</div>` : ''}
          </div>
        </li>`).join('')}
      </ol>
      <div class="m-bottle" ${d.image ? `style="background-image:url(${d.image})"` : ''}>${d.image ? '' : BOTTLE}</div>
    </section>`;
  return `
    ${MENU_DECO}
    ${state.logo
      ? `<div class="m-logo-img" style="background-image:url(${state.logo})"></div>`
      : `<div class="m-logo">${LANH_LOGO}</div>`}
    <div class="m-pills">
      ${state.subtitle ? `<span class="m-pill">${esc(state.subtitle)}</span>` : ''}
    </div>
    <h1 class="m-title">${esc(state.title)}</h1>
    ${state.days.map(day).join('')}
    <section class="m-extra">
      <div class="m-note">${noteHTML(state.note)}</div>
    </section>`;
}

function paintMenu(el) {
  const t = state.theme;
  el.style.setProperty('--m-bg', t.bg);
  el.style.setProperty('--m-lime', t.lime);
  el.style.setProperty('--m-cream', t.cream);
  el.innerHTML = menuHTML();
  // Long day names shrink to fit beside the bottle instead of being cut off
  el.querySelectorAll('.m-day-name').forEach(n => {
    let size = 12.5;
    while (n.scrollWidth > n.clientWidth && size > 8) n.style.fontSize = (size -= 0.5) + 'px';
  });
}
function renderMenu() {
  paintMenu($('#menu'));
  if ($('#zoom').classList.contains('open')) paintMenu($('#zoomScaler .menu'));
  checkNoteFits();
}
// Warn in the editor when the notes no longer fit their box on the menu
function checkNoteFits() {
  const warn = $('#noteWarn');
  if (!warn) return;
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;left:-20000px;top:0;';
  probe.innerHTML = '<div class="menu"></div>';
  document.body.appendChild(probe);
  paintMenu(probe.firstChild);
  const box = probe.querySelector('.m-extra');
  warn.hidden = box.scrollHeight <= box.clientHeight + 1;
  probe.remove();
}

/* ---------- Editor ---------- */
function renderTabs() {
  const tabs = [['general', 'Thông tin chung'], ...state.days.map((_, i) => [String(i), 'Ngày ' + (i + 1)])];
  $('#tabs').innerHTML = tabs.map(([k, l]) => `<button class="pill ${tab === k ? 'on' : ''}" data-tab="${k}">${l}</button>`).join('');
}

const step = (n, title, aside = '') => `<div class="step"><h2>${title}</h2>${aside ? `<span class="aside">${aside}</span>` : ''}</div>`;
const field = (label, path, val, opts = {}) => `<label class="f ${opts.full ? 'full' : ''}"><span>${label}</span>${opts.multi
  ? `<textarea class="inp" data-path="${path}">${esc(val)}</textarea>`
  : `<input class="inp" type="text" data-path="${path}" value="${esc(val)}" placeholder="${esc(opts.ph || '')}">`}</label>`;

const BOTTLE_ICON = `<svg width="38" height="56" viewBox="0 0 38 56" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M13 3h12v8l5 7v31a4 4 0 0 1-4 4H12a4 4 0 0 1-4-4V18l5-7V3Z"/><path d="M8 28h22" stroke-dasharray="3 4"/></svg>`;
const plate = (path, val, sm, label = 'Thả ảnh vào đây') => `
  <div class="plate ${sm ? 'sm' : ''} drop" data-drop="${path}" style="${val ? `background-image:url(${val})` : ''}">
    ${val ? '' : `<div class="ph">${BOTTLE_ICON}${sm ? '' : `<span>${label}</span>`}</div>`}
    <button class="plus" data-img="${path}" title="${val ? 'Đổi ảnh' : 'Thêm ảnh'}" aria-label="Thêm ảnh">+</button>
    ${val ? `<button class="x-img" data-clear="${path}" title="Xoá ảnh" aria-label="Xoá ảnh">✕</button>` : ''}
  </div>`;
const imgField = (title, help, path, val) => `
  <div class="img-field">${plate(path, val, true)}<div class="meta"><strong>${title}</strong>${help}</div></div>`;

function renderPanel() {
  const p = $('#panel');
  if (tab === 'general') {
    p.innerHTML = `
      ${step(1, 'Tiêu đề menu')}
      <div class="panel grid2">
        ${field('Tên gói', 'title', state.title, { full: true })}
        ${field('Loại gói', 'subtitle', state.subtitle, { full: true })}
      </div>
      ${step(3, 'Lưu ý')}
      <div class="panel grid2">
        ${field('Lưu ý <small>(dòng bắt đầu bằng “- ” là gạch đầu dòng; bọc chữ bằng &lt;b&gt;…&lt;/b&gt; để in đậm)</small>', 'note', state.note, { multi: true, full: true })}
        <p class="warn full" id="noteWarn" hidden>Lưu ý đang dài quá khung trên menu, phần cuối sẽ bị ẩn. Hãy rút gọn bớt.</p>
      </div>
      ${step(4, 'Giờ uống', 'Dùng cho cả 7 ngày')}
      <div class="panel times">
        ${state.times.map((t, j) => `<label class="f"><span>Chai ${j + 1}</span><input class="inp" type="text" data-path="times.${j}" value="${esc(t)}"></label>`).join('')}
      </div>
      ${step(5, 'Màu sắc')}
      <div class="panel swatches">
        <label class="swatch"><input type="color" data-path="theme.bg" value="${state.theme.bg}">Nền</label>
        <label class="swatch"><input type="color" data-path="theme.lime" value="${state.theme.lime}">Điểm nhấn</label>
        <label class="swatch"><input type="color" data-path="theme.cream" value="${state.theme.cream}">Thẻ ngày</label>
      </div>
      <div class="pager"><span></span><button class="pill solid" data-tab="0">Bắt đầu với Ngày 1 →</button></div>`;
    return;
  }
  const i = +tab, d = state.days[i], last = state.days.length - 1;
  p.innerHTML = `
    ${step(1, `Chủ đề ngày ${i + 1}`)}
    <div class="panel grid2">
      ${field('Tên chủ đề', `days.${i}.name`, d.name, { full: true })}
      <div class="full">${imgField('Ảnh chai của ngày', 'Thay hình chai xanh trong thẻ ngày. PNG nền trong suốt là đẹp nhất.', `days.${i}.image`, d.image)}</div>
    </div>
    ${step(2, '5 chai nước')}
    <div class="rows">
      ${d.items.map((it, j) => `
        <article class="row">
          <div class="row-main">
            <input class="inp row-name" type="text" placeholder="Tên nước" data-path="days.${i}.items.${j}.name" value="${esc(it.name)}">
            <input class="inp row-ing" type="text" placeholder="Thành phần, cách nhau bằng dấu phẩy" data-path="days.${i}.items.${j}.ing" value="${esc(it.ing)}">
          </div>
          <div class="row-side">
            <label class="switch" title="Gắn nhãn món mới"><input type="checkbox" data-path="days.${i}.items.${j}.isNew" ${it.isNew ? 'checked' : ''}>Mới</label>
            <div class="row-move">
              <button class="icon-btn" data-move="${i},${j},-1" ${j === 0 ? 'disabled' : ''} aria-label="Lên">↑</button>
              <button class="icon-btn" data-move="${i},${j},1" ${j === d.items.length - 1 ? 'disabled' : ''} aria-label="Xuống">↓</button>
            </div>
          </div>
        </article>`).join('')}
    </div>
    <div class="pager">
      <button class="pill" data-tab="${i === 0 ? 'general' : i - 1}">← ${i === 0 ? 'Thông tin chung' : 'Ngày ' + i}</button>
      ${i < last ? `<button class="pill solid" data-tab="${i + 1}">Ngày ${i + 2} →</button>` : `<button class="pill solid" data-act="export">Lưu ảnh menu</button>`}
    </div>`;
}

function setPath(path, val) {
  const keys = path.split('.');
  let o = state;
  keys.slice(0, -1).forEach(k => o = o[k]);
  o[keys.at(-1)] = val;
}

function update() { renderMenu(); save(); }
function full() { renderTabs(); renderPanel(); update(); }
function goTab(t) {
  tab = t; renderTabs(); renderPanel(); checkNoteFits();
  $('.side-body').scrollTo({ top: 0, behavior: 'smooth' });
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]');
  if (t) goTab(t.dataset.tab);
});

$('#panel').addEventListener('input', e => {
  const el = e.target, path = el.dataset.path;
  if (!path) return;
  setPath(path, el.type === 'checkbox' ? el.checked : el.value);
  update();
});

let imgTarget = null;
$('#panel').addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.img) { imgTarget = t.dataset.img; $('#fileImg').value = ''; $('#fileImg').click(); }
  if (t.dataset.clear) { setPath(t.dataset.clear, null); renderPanel(); update(); }
  if (t.dataset.move) {
    const [i, j, dir] = t.dataset.move.split(',').map(Number);
    const items = state.days[i].items;
    [items[j], items[j + dir]] = [items[j + dir], items[j]];
    renderPanel(); update();
  }
  if (t.dataset.act === 'export') exportPng();
});

/* Images: pick or drag-and-drop. Shrink so drafts stay small; keep PNG for transparent logos */
function readImage(file, maxSide) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, maxSide / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const png = file.type === 'image/png' || file.type === 'image/svg+xml';
      res(c.toDataURL(png ? 'image/png' : 'image/jpeg', 0.88));
      URL.revokeObjectURL(img.src);
    };
    img.onerror = rej;
    img.src = URL.createObjectURL(file);
  });
}
async function placeImage(path, file) {
  if (!file || !file.type.startsWith('image/')) return toast('Hãy chọn một file ảnh.');
  try {
    const max = path === 'logo' ? 700 : 600;
    setPath(path, await readImage(file, max));
    renderPanel(); update();
  } catch { toast('Không đọc được ảnh này.'); }
}
$('#fileImg').addEventListener('change', e => imgTarget && placeImage(imgTarget, e.target.files[0]));
$('#panel').addEventListener('dragover', e => {
  const d = e.target.closest('.drop'); if (!d) return;
  e.preventDefault(); d.classList.add('drag');
});
$('#panel').addEventListener('dragleave', e => e.target.closest('.drop')?.classList.remove('drag'));
$('#panel').addEventListener('drop', e => {
  const d = e.target.closest('.drop'); if (!d) return;
  e.preventDefault(); d.classList.remove('drag');
  placeImage(d.dataset.drop, e.dataTransfer.files[0]);
});

/* ---------- Save / open / export ---------- */
const stamp = () => new Date().toLocaleDateString('sv-SE'); // local YYYY-MM-DD
function download(href, name) {
  const a = document.createElement('a');
  a.href = href; a.download = name; document.body.appendChild(a); a.click(); a.remove();
}

async function exportPng() {
  const btn = $('#exportPng');
  btn.disabled = true; btn.textContent = 'Đang tạo ảnh…';
  try {
    await document.fonts.ready;
    // Render an off-screen copy so export works even when the preview is hidden (phones)
    const host = document.createElement('div');
    host.style.cssText = 'position:fixed;left:-20000px;top:0;';
    host.innerHTML = '<div class="menu"></div>';
    document.body.appendChild(host);
    paintMenu(host.firstChild);
    let url;
    try { url = await htmlToImage.toPng(host.firstChild, { pixelRatio: 2480 / 595, width: 595, height: 842, cacheBust: true }); }
    finally { host.remove(); }
    download(url, `menu-lanh-detox-7-ngay-${stamp()}.png`);
    toast('Đã lưu ảnh vào thư mục Downloads');
  } catch (err) {
    console.error(err);
    toast('Không tạo được ảnh — kiểm tra mạng rồi thử lại.');
  }
  btn.disabled = false; btn.textContent = 'Lưu ảnh menu';
}
function saveJson() {
  const blob = new Blob([JSON.stringify(state)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  download(url, `menu-lanh-${stamp()}.json`);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('Đã lưu bản nháp — mở lại bằng “Mở bản nháp”');
}
function openJson() { $('#fileJson').value = ''; $('#fileJson').click(); }
function printMenu() {
  const root = $('#printRoot');
  root.innerHTML = '<div class="menu"></div>';
  paintMenu(root.firstChild);
  window.print();
}
function reset() {
  if (!confirm('Xoá mọi thay đổi và quay về menu mẫu?')) return;
  state = structuredClone(DEFAULT); tab = 'general'; full();
}

$('#exportPng').addEventListener('click', exportPng);
$('#saveJson').addEventListener('click', saveJson);
$('#openJson').addEventListener('click', openJson);
$('#fileJson').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!Array.isArray(data.days)) throw 0;
    state = withDefaults(data);
    tab = 'general'; full(); toast('Đã mở bản nháp');
  } catch { toast('File này không phải bản nháp menu.'); }
});

$('#moreBtn').addEventListener('click', e => { e.stopPropagation(); $('#moreList').classList.toggle('open'); });
document.addEventListener('click', () => $('#moreList').classList.remove('open'));
$('#moreList').addEventListener('click', e => {
  const a = e.target.dataset.act;
  ({ open: openJson, save: saveJson, print: printMenu, reset })[a]?.();
});

/* ---------- Preview sizing + zoom ---------- */
function fitTo(scaler, width, height) {
  const k = Math.min(width / 595, height ? height / 842 : Infinity);
  scaler.style.transform = `scale(${k})`;
  scaler.style.width = 595 * k + 'px';
  scaler.style.height = 842 * k + 'px';
}
function fit() {
  const st = $('#stage');
  if (st.offsetParent) fitTo($('#scaler'), st.clientWidth - 64, st.clientHeight - 84);
  if ($('#zoom').classList.contains('open')) {
    const w = innerWidth - 32, h = innerWidth < 700 ? 0 : innerHeight - 64;
    fitTo($('#zoomScaler'), w, h);
  }
}
function openZoom() {
  const z = $('#zoom');
  $('#zoomScaler').innerHTML = '<div class="menu"></div>';
  z.classList.add('open'); renderMenu(); fit();
  document.body.style.overflow = 'hidden';
}
$('#zoom').addEventListener('click', () => { $('#zoom').classList.remove('open'); document.body.style.overflow = ''; });
$('#frame').addEventListener('click', openZoom);
$('#fab').addEventListener('click', openZoom);
window.addEventListener('resize', fit);

let tt;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2600);
}

$('#topMark').innerHTML = LANH_LOGO;
full(); fit();
</script>
</body>
